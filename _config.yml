title: BetterLGU Directory by BetterGov.ph
description: A community-maintained directory of Better LGU digital transparency portals across the Philippines — find an existing portal before you build, contribute to one, or start your own.
baseurl: ""
url: "https://lgu.bettergov.ph"

markdown: kramdown
theme: jekyll-theme-minimal

# Old uppercase URLs (/BUDGET, /GUIDE, ...) redirect to the lowercase ones
# through the stub pages in redirects/ (#429). GitHub Pages supports this
# plugin; its default plugins stay on.
plugins:
  - jekyll-redirect-from

# BUDGET_GUIDE.md and BUDGET_TEMPLATES.md come from the main branch with no
# front matter (jekyll-optional-front-matter renders them). Their layout and
# title live here instead of in a front-matter block, so later edits to those
# files never add/add-conflict in the sync merge.
defaults:
  - scope:
      path: "BUDGET_GUIDE.md"
    values:
      layout: default
      title: Start Your Budget Portal
      permalink: /budget-guide
  - scope:
      path: "BUDGET_TEMPLATES.md"
    values:
      layout: default
      title: Budget Portal Templates
      permalink: /budget-templates
  # PRIVACY.md comes from main with no front matter, like the budget docs (#426).
  - scope:
      path: "PRIVACY.md"
    values:
      layout: default
      title: Privacy
      permalink: /privacy
  # FUNDING.md comes from main with no front matter, like PRIVACY.md (#498).
  - scope:
      path: "FUNDING.md"
    values:
      layout: default
      title: Funding Policy
      permalink: /funding
  # Lowercase URLs (#429). The filenames on main stay uppercase (GitHub
  # conventions), so the published URL is set here rather than in their front
  # matter, which keeps the sync merge conflict-free. The redirects from the
  # old uppercase URLs are the stub pages in redirects/. Each old/new pair
  # builds two files differing only in case (GUIDE.html, guide.html), so a
  # local build on a case-insensitive filesystem (macOS, Windows) overwrites
  # one with the other. GitHub Pages builds on Linux and is unaffected.
  - scope:
      path: "GUIDE.md"
    values:
      permalink: /guide
  - scope:
      path: "TEMPLATES.md"
    values:
      permalink: /templates
  - scope:
      path: "CONTRIBUTING.md"
    values:
      permalink: /contributing
  - scope:
      path: "CODE_OF_CONDUCT.md"
    values:
      permalink: /code-of-conduct
  - scope:
      path: "CHANGELOG.md"
    values:
      permalink: /changelog
  # Maintainer Profiles (#426) come from main. A profile carries no layout or
  # title key, because GitHub would show them in the profile's front-matter
  # table. The permalink matches the /maintainers/<handle>/ URL the sync
  # emits. The /maintainers/ index page is maintainers.md at the root.
  - scope:
      path: "maintainers"
    values:
      layout: maintainer-profile
      title: Maintainer Profile
      permalink: /maintainers/:basename/

exclude:
  # GitHub index for Maintainer Profiles (#426). The site's /maintainers/ page
  # is maintainers.md, rendered from _data/maintainer_profiles.yml.
  - "maintainers/README.md"
  # Source table for /budget (budget-directory.md renders it from _data).
  - "BUDGET.md"
  - ".github"
  - ".idea"
  - ".gitignore"
  - "LICENSE"
# Links in docs from main to repo files the site doesn't publish (excluded,
# underscore-prefixed, or README.md, which index.md replaces). On GitHub the
# relative link is right, so main keeps it; the default layout rewrites the
# href on the site. `page` is the source path of the site page to link
# instead, so the link follows that page's permalink; `url` is used as-is.
# scripts/test-github-only-links-site.js fails when a link is missing here.
github_only_links:
  - href: README.md
    page: index.md
  - href: BUDGET.md
    page: budget-directory.md
  - href: maintainers/README.md
    page: maintainers.md
  - href: maintainers/_template.md
    url: https://github.com/jmacj/better-lgu-directory/blob/main/maintainers/_template.md
  - href: LICENSE
    url: https://github.com/jmacj/better-lgu-directory/blob/main/LICENSE
