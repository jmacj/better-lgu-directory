name: Triage Directory PR

# pull_request_target so forks get a write-scoped token. The job checks out the
# base branch and only ever reads the pull request's README.md as data — no
# contributor code is executed.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          # Full history so the merge base with the pull request is reachable.
          fetch-depth: 0

      - name: Read both sides of the diff
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
          # Diff against the merge base, not the tip of the base branch: an
          # out-of-date branch would otherwise look like it deleted every entry
          # merged since it was forked.
          merge_base=$(git merge-base HEAD refs/remotes/pr/head)
          echo "Comparing ${merge_base} against the pull request head."
          git show "${merge_base}:README.md" > "${RUNNER_TEMP}/base-README.md"
          git show refs/remotes/pr/head:README.md > "${RUNNER_TEMP}/head-README.md"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Diff directory entries
        id: triage
        env:
          COMMENT_FILE: ${{ runner.temp }}/triage-comment.md
        run: node scripts/triage-pr.js "${RUNNER_TEMP}/base-README.md" "${RUNNER_TEMP}/head-README.md"

      - name: Apply labels
        if: steps.triage.outputs.labels != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --add-label "${{ steps.triage.outputs.labels }}"

      - name: Post or update the triage comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMENT_FILE: ${{ runner.temp }}/triage-comment.md
        run: |
          [ -s "$COMMENT_FILE" ] || exit 0
          existing=$(gh api "repos/${REPO}/issues/${PR}/comments?per_page=100" \
            --jq '[.[] | select(.body | startswith("<!-- lgu-triage-bot -->")) | .id] | first // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@"$COMMENT_FILE"
          else
            gh pr comment "$PR" --body-file "$COMMENT_FILE"
          fi
