name: Label PR by Path

# pull_request_target is required so the workflow gets a write-scoped token on
# pull requests opened from forks — which is how every community entry arrives.
# It runs the base branch's config, never the contributor's code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Never strip labels a maintainer added by hand.
          sync-labels: false
