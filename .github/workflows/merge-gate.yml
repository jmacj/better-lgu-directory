name: Merge Gate

# Publishes the triage/no-blocking-labels commit status, which turns red while a
# pull request still carries needs-* or blocked. Make that status a required
# check on the protected branch to actually prevent merging.
#
# The triage workflow publishes the same status after it applies its own labels,
# because labels set with GITHUB_TOKEN do not fire the labeled event here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/merge-gate.sh
          sparse-checkout-cone-mode: false

      - name: Publish blocking-label status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash scripts/merge-gate.sh
