name: Sync Directory to Website

on:
  push:
    branches:
      - main
  schedule:
    # 16:00 UTC = 00:00 Asia/Manila (#179) — re-crawls Logos/Featured metadata
    # monthly even with no push to main, so a portal that ships a new favicon
    # (or lets an old one bit-rot past the byte ceiling) gets picked up
    # without waiting on unrelated directory activity. Same boundary as
    # rebuild-featured.yml's daily schedule.
    - cron: '0 16 1 * *'

# Shared with rebuild-featured.yml (#132) so a same-time crawl commit and a
# no-commit Pages rebuild request can't race each other.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main-pages (Website)
        uses: actions/checkout@v6
        with:
          ref: main-pages
          fetch-depth: 0 # Needed for merge

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into main-pages
        run: |
          git fetch origin main
          git merge origin/main --no-edit

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate LGU Data
        run: |
          node scripts/sync-to-data.js

      - name: Generate Featured Portal Metadata
        run: |
          node scripts/crawl-lgu-meta.js

      - name: Commit and Push to main-pages
        run: |
          git add _data/ assets/images/lgu-logos/
          if git diff --staged --quiet; then
            echo "No data changes — pushing merge only"
          else
            git commit -m "chore(data): auto-sync directory entries from README.md"
          fi
          git push origin main-pages
