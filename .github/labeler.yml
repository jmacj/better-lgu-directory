# Path-based labels for pull requests.
#
# README.md is deliberately NOT matched here — it holds the directory table,
# so it is triaged by scripts/triage-pr.js instead (entry:new / entry:update /
# entry:collision / needs-verification, or docs for prose-only edits).

"entry:template":
  - changed-files:
      - any-glob-to-any-file:
          - TEMPLATES.md
          - BUDGET_TEMPLATES.md

# BUDGET.md holds the Budget Portal table. scripts/triage-pr.js only diffs
# README.md, so budget PRs get this path label instead of entry:new/update.
"entry:budget":
  - changed-files:
      - any-glob-to-any-file: BUDGET.md

site:
  - changed-files:
      - any-glob-to-any-file:
          - _config.yml
          - _data/**
          - _includes/**
          - _layouts/**
          - assets/**
          - scripts/sync-to-data.js
          - scripts/sync-budget-to-data.js
          - "**/*.html"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/labeler.yml
          - .github/workflows/**
          - scripts/triage-pr.js

docs:
  - changed-files:
      - any-glob-to-any-file:
          - .github/ISSUE_TEMPLATE/**
          - .github/PULL_REQUEST_TEMPLATE.md
          - CHANGELOG.md
          - CODE_OF_CONDUCT.md
          - CONTEXT.md
          - CONTRIBUTING.md
          - GUIDE.md
          - BUDGET_GUIDE.md
